# Netlify configuration — generate the site, then publish only the explicit
# static allowlist. PHP is intentionally excluded because Netlify cannot run it.
[build]
  publish = "dist/netlify"
  command = "node build/generate.js && node build/package-deploy.js netlify"

# Fonts never change (same filename = same bytes) → cache hard.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Vendor filenames are not content-hashed, so they must revalidate after a day.
# App CSS/JS + images → cache a day, revalidate (Netlify adds ETag).
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Enforced security headers for every Netlify-served response. The PHP contact
# handler still requires a PHP host; these rules do not make Netlify execute it.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; base-uri 'none'; connect-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://analytics.google.com https://*.doubleclick.net https://www.google.com https://www.googleadservices.com; font-src 'self'; form-action 'self'; frame-ancestors 'none'; frame-src https://www.googletagmanager.com; img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://*.doubleclick.net https://www.google.com https://www.google.com.sa https://www.google.ae https://www.google.com.kw https://www.google.com.qa https://www.google.com.bh https://www.google.com.om https://www.google.com.eg https://www.google.jo https://www.google.com.lb https://www.google.nl; manifest-src 'self'; media-src 'none'; object-src 'none'; script-src 'self' https://www.googletagmanager.com https://www.googleadservices.com https://googleads.g.doubleclick.net; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; worker-src 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "accelerometer=(), autoplay=(), camera=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), xr-spatial-tracking=()"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Origin-Agent-Cluster = "?1"
    X-Permitted-Cross-Domain-Policies = "none"
    X-XSS-Protection = "0"

# ---- Legacy URL map ---------------------------------------------------------
# Mirrors the rules in .htaccess so the two hosts cannot drift. Unknown old paths
# deliberately fall through to the 404 page rather than being swept to the
# homepage — a blanket homepage redirect reads as a soft 404 to Google and loses
# the same link equity, while hiding the problem from Search Console.

# Arabic moved from /ar/ to the site root.
[[redirects]]
  from = "/ar/*"
  to = "/:splat"
  status = 301
  force = true

# Directory-index and extension leftovers from the previous site.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/index.php"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/en/index.html"
  to = "/en/"
  status = 301
  force = true

[[redirects]]
  from = "/contact.php"
  to = "/contact.html"
  status = 301
  force = true

[[redirects]]
  from = "/en/contact.php"
  to = "/en/contact.html"
  status = 301
  force = true

# Legacy Osool URLs, recovered from Google's live index on 2026-08-12 (no Search
# Console export was available). Netlify redirects are glob-based, not regex, so
# this is the explicit subset; the .htaccess keyword map covers the rest on the
# PHP host. Anything unmatched falls through to /404.html, which lists every
# service — never a blanket redirect to the homepage, which reads as a soft 404.

# Confirmed indexed and 404ing. Note /ar/* alone does not save these: stripping
# the prefix from /ar/raid-… yields /raid-…, which is also a 404.
[[redirects]]
  from = "/ar/raid-*"
  to = "/services/raid-servers.html"
  status = 301
  force = true

[[redirects]]
  from = "/hard-drive-data-recovery/*"
  to = "/services/hdd.html"
  status = 301
  force = true

[[redirects]]
  from = "/solid-state-drive-data-recovery-services/*"
  to = "/services/ssd-nvme.html"
  status = 301
  force = true

# Likely siblings of the two confirmed English service slugs, following the same
# naming pattern. A rule for a URL that never existed costs nothing; a missing
# rule for one that did costs the link.
[[redirects]]
  from = "/ransomware-data-recovery/*"
  to = "/services/ransomware.html"
  status = 301
  force = true

[[redirects]]
  from = "/raid-data-recovery/*"
  to = "/services/raid-servers.html"
  status = 301
  force = true

[[redirects]]
  from = "/server-data-recovery/*"
  to = "/services/raid-servers.html"
  status = 301
  force = true

[[redirects]]
  from = "/flash-data-recovery/*"
  to = "/services/memory-cards.html"
  status = 301
  force = true

[[redirects]]
  from = "/memory-card-data-recovery/*"
  to = "/services/memory-cards.html"
  status = 301
  force = true

[[redirects]]
  from = "/mobile-data-recovery/*"
  to = "/services/phones.html"
  status = 301
  force = true

[[redirects]]
  from = "/database-data-recovery/*"
  to = "/services/raid-servers.html"
  status = 301
  force = true

# Never expose source, developer tooling, test artifacts, or PHP source from a
# static Netlify deployment. Production form handling belongs on the PHP host.
[[redirects]]
  from = "/build/*"
  to = "/en/"
  status = 404
  force = true

[[redirects]]
  from = "/design/*"
  to = "/en/"
