; PHP/FPM defense-in-depth for the public contact handler.
; Keep this file private from HTTP; .htaccess explicitly denies it.
post_max_size = 64K
upload_max_filesize = 64K
max_input_vars = 20
max_input_nesting_level = 4
max_input_time = 10
max_execution_time = 15
memory_limit = 128M
default_charset = "UTF-8"
display_errors = Off
display_startup_errors = Off
log_errors = On
html_errors = Off
expose_php = Off
zend.exception_ignore_args = On
mail.add_x_header = Off
